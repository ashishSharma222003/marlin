<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volumetric Sphere</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.42);
    font-size: 13px;
    letter-spacing: 0.02em;
    pointer-events: none;
    transition: opacity 0.6s ease;
    text-align: center;
    line-height: 1.6;
  }
  #hint.fade { opacity: 0; }

  #energyBar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #2effc2, #a35bff);
    width: 0%;
    transition: width 0.08s linear;
    box-shadow: 0 0 8px rgba(46,255,194,0.6);
  }

  /* ---------- response text, shown center-stage while the sphere
     drifts to the top-right during an answer ---------- */
  #responseWrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 0 8vw;
    box-sizing: border-box;
  }
  #responseText {
    max-width: 640px;
    color: rgba(255,255,255,0.92);
    font-size: 19px;
    line-height: 1.65;
    letter-spacing: 0.01em;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    text-shadow: 0 2px 24px rgba(0,0,0,0.55);
  }
  #responseText.show {
    opacity: 1;
    transform: translateY(0);
  }
  #responseText .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: rgba(255,255,255,0.75);
    margin-left: 2px;
    vertical-align: -0.15em;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- chat dock, bottom of page ---------- */
  #chatDock {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: min(640px, 88vw);
    z-index: 10;
  }
  #chatForm {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(18, 20, 28, 0.55);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: 999px;
    padding: 8px 8px 8px 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  #chatForm:focus-within {
    border-color: rgba(111, 216, 255, 0.5);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 3px rgba(111,216,255,0.08);
  }
  #chatInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: rgba(255,255,255,0.94);
    font-size: 14.5px;
    font-family: inherit;
    padding: 8px 0;
  }
  #chatInput::placeholder { color: rgba(255,255,255,0.38); }

  #chatSend {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2effc2, #6fd8ff);
    color: #05060a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #chatSend:hover:not(:disabled) { transform: scale(1.07); }
  #chatSend:disabled { opacity: 0.35; cursor: default; }
  #chatSend svg { width: 16px; height: 16px; }

  #chatStatus {
    position: fixed;
    left: 50%;
    bottom: 78px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 0.03em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #chatStatus.show { opacity: 1; }
</style>
</head>
<body>

<div id="energyBar"></div>
<div id="hint">drag to rotate &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click to trigger a change &nbsp;·&nbsp; ask a question below</div>

<div id="responseWrap"><div id="responseText"></div></div>
<div id="chatStatus"></div>

<div id="chatDock">
  <form id="chatForm" autocomplete="off">
    <input id="chatInput" type="text" placeholder="Ask something…" maxlength="4000" />
    <button id="chatSend" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
    </button>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- basic scene setup ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6.2);

  // antialias off and no alpha channel: both cost extra GPU work we don't need
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ---------- geometry: enough resolution to stay smooth, no more ----------
  const geometry = new THREE.IcosahedronGeometry(1.6, 16);

  // ---------- shader material ----------
  const uniforms = {
    uTime:    { value: 0 },
    uEnergy:  { value: 0 },   // decaying pulse, only rises on click
    uTideDir: { value: new THREE.Vector3(1, 0, 0) },  // world-space "moon" direction
    uTideAmt: { value: 0 },   // fades in/out when space is pressed
    uColorA:  { value: new THREE.Color(0x3a1f7a) }, // deep violet
    uColorB:  { value: new THREE.Color(0x6fd8ff) }, // pale cyan glow
    uColorC:  { value: new THREE.Color(0xff6f61) }  // warm ripple accent
  };

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: `
      uniform float uTime;
      uniform float uEnergy;
      uniform vec3 uTideDir;
      uniform float uTideAmt;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisp;

      // --- classic simplex noise (Ashima/McEwan), compact 3D version ---
      vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // displacement amount at a given point on the base sphere
      float displacement(vec3 p) {
        float base = snoise(p * 0.8 + uTime * 0.15) * 0.14;
        float wave = snoise(p * 1.6 - uTime * 0.22) * 0.06;
        float d = base + wave;
        // this extra noise sample only runs while a click pulse is active,
        // skipping it the rest of the time saves real GPU work at rest
        if (uEnergy > 0.001) {
          d += snoise(p * 2.4 - uTime * 0.7) * 0.16 * uEnergy;
        }
        // tide: one clear bulge pulled toward the "moon" direction, like
        // something is reaching in and stretching that part of the surface.
        // Skipped entirely when off.
        if (uTideAmt > 0.001) {
          float align = max(dot(normalize(p), uTideDir), 0.0);
          float lobe = pow(align, 3.0);
          d += lobe * uTideAmt * 0.55;
        }
        return d;
      }

      void main() {
        // displace the center point
        float centerDisp = displacement(position);
        vec3 displaced = position + normal * centerDisp;
        vDisp = centerDisp;

        // sample two nearby points along the local tangent plane and
        // displace them too, then rebuild the normal from the resulting
        // surface so shading follows the smooth fluid shape rather than
        // the flat facets of the underlying low-poly sphere
        float e = 0.035;
        vec3 tangent1 = normalize(cross(normal, abs(normal.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        vec3 tangent2 = normalize(cross(normal, tangent1));

        vec3 pA = position + tangent1 * e;
        vec3 pB = position + tangent2 * e;
        vec3 dA = pA + normal * displacement(pA);
        vec3 dB = pB + normal * displacement(pB);

        vec3 smoothNormal = normalize(cross(dA - displaced, dB - displaced));
        vNormal = normalize(normalMatrix * smoothNormal);

        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
        vViewDir = normalize(cameraPosition - worldPos.xyz);

        gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      uniform float uEnergy;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisp;

      void main() {
        float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.2);

        // base gradient between two deep tones, lifted by displacement
        vec3 base = mix(uColorA, uColorB, clamp(vDisp * 3.0 + 0.5, 0.0, 1.0));

        // warm accent bleeds in with energy / ripple intensity
        vec3 col = mix(base, uColorC, clamp(uEnergy * 0.5 + abs(vDisp) * 1.5, 0.0, 0.6));

        // rim glow
        col += fresnel * 0.55;

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);

  // random per-load starting point in the noise field, so the shape's
  // evolution is different every time the page opens, not the same replay
  const timeSeed = Math.random() * 1000;

  // ---------- interaction: drag to rotate the sphere in place ----------
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let rotX = 0.15, rotY = 0.3;
  let velX = 0, velY = 0.0015; // gentle idle spin

  function pointerDown(x, y) {
    isDragging = true;
    prevX = x; prevY = y;
    velX = 0; velY = 0;
  }
  function pointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - prevX;
    const dy = y - prevY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    velY = dx * 0.0006;
    velX = dy * 0.0006;
    prevX = x; prevY = y;
  }
  function pointerUp() { isDragging = false; }

  renderer.domElement.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  renderer.domElement.addEventListener('touchstart', e => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', pointerUp);

  // zoom limits: MIN_ZOOM is kept safely outside the sphere's radius (1.6)
  // plus the largest it can ever bulge out to, so the camera can't end up
  // inside the surface no matter how far someone scrolls in
  const MIN_ZOOM = 3.2;
  const MAX_ZOOM = 10;

  // scroll to zoom
  window.addEventListener('wheel', e => {
    camera.position.z += e.deltaY * 0.003;
    camera.position.z = Math.min(Math.max(camera.position.z, MIN_ZOOM), MAX_ZOOM);
  }, { passive: true });

  // ---------- tide: a bulge orbiting the sphere, like Earth's tidal bulge
  // staying pointed at the Moon while Earth spins underneath it. Driven
  // entirely by chat state now (on while a reply is streaming), not by a
  // standalone keybinding ----------
  let tideOn = false;
  let tideAmt = 0;
  let tideAngle = 0;
  const tideWorldDir = new THREE.Vector3();
  const tideLocalDir = new THREE.Vector3();
  const invQuat = new THREE.Quaternion();

  // ---------- chat-driven state: "thinking" (normal sim, centered) while
  // the user is typing/waiting, "answering" (tide + sphere drifts to a
  // small top-right "logo", center stage clears for the response text)
  // while a reply streams in ----------
  let chatState = 'idle'; // idle | thinking | answering
  const posX = { cur: 0 }, posY = { cur: 0 };
  const posScale = { cur: 1 };

  function setChatState(state) {
    chatState = state;
    tideOn = (state === 'answering');
  }

  // Dock target is recomputed every frame from the camera's actual visible
  // frustum at the sphere's depth, so "top-right corner" always means the
  // real top-right corner of the viewport regardless of window size/aspect
  // ratio or zoom level — not a fixed world-unit guess. The inset is a
  // fixed screen-space fraction (of the *smaller* viewport dimension, so it
  // scales sensibly on both narrow and wide windows) plus the sphere's own
  // radius at logo scale, so the "logo" always sits fully on-screen with
  // consistent breathing room instead of clipping on narrow viewports.
  const SPHERE_RADIUS = 1.6; // matches the IcosahedronGeometry radius above
  const DOCK_SCALE = 0.16;   // "logo" size relative to full sphere scale
  const DOCK_INSET_FRAC = 0.1; // corner inset, as a fraction of min(viewWidth, viewHeight)

  function getDockTarget() {
    const dist = camera.position.z; // sphere sits at z=0, camera looks down -z
    const viewHeight = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * dist;
    const viewWidth = viewHeight * camera.aspect;
    const inset = Math.min(viewWidth, viewHeight) * DOCK_INSET_FRAC;
    const logoRadius = SPHERE_RADIUS * DOCK_SCALE;
    return {
      x: Math.max(viewWidth / 2 - inset - logoRadius, logoRadius),
      y: Math.max(viewHeight / 2 - inset - logoRadius, logoRadius),
    };
  }

  // ---------- click triggers a "pulse": the only thing that changes shape ----------
  let energy = 0;
  const energyBar = document.getElementById('energyBar');
  const hint = document.getElementById('hint');

  renderer.domElement.addEventListener('click', () => {
    energy = Math.min(energy + 0.9, 1.6);
    hint.classList.add('fade');
  });

  // ---------- resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animation loop ----------
  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    elapsed += delta;

    // decay energy smoothly back toward 0 after a click
    energy += (0 - energy) * 0.035;
    uniforms.uTime.value = elapsed + timeSeed;
    uniforms.uEnergy.value = energy;
    energyBar.style.width = Math.min(energy / 1.6 * 100, 100) + '%';

    // tide: fade the effect in/out, and keep the "moon" orbiting steadily
    // in world space while the sphere spins independently underneath it
    tideAmt += ((tideOn ? 1 : 0) - tideAmt) * 0.03;
    if (tideAmt > 0.001) {
      tideAngle += delta * 0.9;
      // orbit in the camera's right/up plane (not the view-axis plane), so
      // the bulge always sweeps around the visible edge of the sphere as
      // seen on screen, instead of sometimes facing straight at/away from
      // the camera where it would look like a blob or disappear entirely
      tideWorldDir.set(Math.cos(tideAngle), Math.sin(tideAngle), 0);
      invQuat.copy(sphere.quaternion).invert();
      tideLocalDir.copy(tideWorldDir).applyQuaternion(invQuat);
      uniforms.uTideDir.value.copy(tideLocalDir);
    }
    uniforms.uTideAmt.value = tideAmt;

    if (!isDragging) {
      rotX += velX;
      rotY += velY;
      velX *= 0.96;
      velY += (0.0015 - velY) * 0.01; // settle back to gentle idle spin
    }
    sphere.rotation.x = rotX;
    sphere.rotation.y = rotY;

    // scale bump ties directly to energy, so it only pulses on a click
    const answering = (chatState === 'answering');
    const scaleTarget = answering ? DOCK_SCALE : 1;
    const targetScale = scaleTarget + energy * 0.03 * (answering ? DOCK_SCALE : 1);
    posScale.cur += (targetScale - posScale.cur) * 0.06;
    sphere.scale.setScalar(posScale.cur);

    // smoothly drift toward the top-right "logo" position when answering,
    // and back to center otherwise — same easing both directions so the
    // transition reads as one continuous, reversible motion. Target is
    // recomputed from the live camera frustum every frame, so it always
    // lands in the real top-right corner regardless of window size/aspect
    // ratio, and re-settles correctly if the window is resized mid-dock.
    const dock = getDockTarget();
    const targetX = answering ? dock.x : 0;
    const targetY = answering ? dock.y : 0;
    posX.cur += (targetX - posX.cur) * 0.045;
    posY.cur += (targetY - posY.cur) * 0.045;
    sphere.position.x = posX.cur;
    sphere.position.y = posY.cur;

    renderer.render(scene, camera);
  }
  animate();

  // ---------- chat wiring ----------
  const API_BASE = window.MARLIN_API_BASE || 'http://localhost:8000';

  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatStatus = document.getElementById('chatStatus');
  const responseText = document.getElementById('responseText');

  let threadId = null;
  let threadReady = null;
  let sending = false;

  function ensureThread() {
    if (threadReady) return threadReady;
    threadReady = fetch(`${API_BASE}/conversations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: '' }),
    })
      .then(r => {
        if (!r.ok) throw new Error(`conversation create failed: ${r.status}`);
        return r.json();
      })
      .then(data => { threadId = data.thread_id; return threadId; })
      .catch(err => {
        threadReady = null; // allow retry on next send
        throw err;
      });
    return threadReady;
  }
  // warm the conversation up front so the first send doesn't wait on it
  ensureThread().catch(() => {});

  function setStatus(msg) {
    chatStatus.textContent = msg;
    chatStatus.classList.toggle('show', !!msg);
  }

  function showResponseCursor() {
    responseText.classList.add('show');
    responseText.innerHTML = '<span class="cursor"></span>';
  }

  function appendResponseToken(token) {
    const cursor = responseText.querySelector('.cursor');
    const textNode = document.createTextNode(token);
    if (cursor) {
      responseText.insertBefore(textNode, cursor);
    } else {
      responseText.appendChild(textNode);
    }
  }

  function finishResponse() {
    const cursor = responseText.querySelector('.cursor');
    if (cursor) cursor.remove();
  }

  function clearResponse() {
    responseText.classList.remove('show');
    responseText.textContent = '';
  }

  async function sendMessage(message) {
    if (sending || !message.trim()) return;
    sending = true;
    chatSend.disabled = true;
    hint.classList.add('fade');

    // "thinking": normal simulation, centered, while we wait for the
    // request to go out and the first tokens to arrive
    setChatState('thinking');
    clearResponse();
    setStatus('thinking…');

    try {
      const id = await ensureThread();

      const res = await fetch(`${API_BASE}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, thread_id: id }),
      });
      if (!res.ok || !res.body) throw new Error(`chat request failed: ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let answering = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        // SSE frames are separated by a blank line
        let frameEnd;
        while ((frameEnd = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, frameEnd);
          buf = buf.slice(frameEnd + 2);

          let event = 'message';
          let data = '';
          for (const line of frame.split('\n')) {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            else if (line.startsWith('data:')) data += line.slice(5).trim();
          }
          if (!data) continue;

          let payload;
          try { payload = JSON.parse(data); } catch { continue; }

          if (event === 'progress') {
            setStatus(typeof payload.content === 'string' ? payload.content : 'working…');
          } else if (event === 'token') {
            if (!answering) {
              // first token: sphere drifts to the top-right and switches
              // to its tidal motion, center stage opens up for the reply
              answering = true;
              setChatState('answering');
              setStatus('');
              showResponseCursor();
            }
            appendResponseToken(payload.content || '');
          } else if (event === 'done') {
            finishResponse();
            setStatus('');
          } else if (event === 'error') {
            finishResponse();
            appendResponseToken(`\n\n[error: ${payload.detail || 'something went wrong'}]`);
            setStatus('');
          }
        }
      }
    } catch (err) {
      setStatus('');
      responseText.classList.add('show');
      responseText.textContent = `Couldn't reach the assistant (${err.message}). Is the backend running?`;
      setChatState('answering');
    } finally {
      sending = false;
      chatSend.disabled = false;
    }
  }

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const message = chatInput.value;
    if (!message.trim() || sending) return;
    chatInput.value = '';
    // returning to the input to type again feels like "asking a new
    // question" — bring the sphere back to center and normal motion
    setChatState('thinking');
    sendMessage(message);
  });

  chatInput.addEventListener('focus', () => {
    if (chatState === 'answering') setChatState('thinking');
  });
})();
</script>
</body>
</html>
