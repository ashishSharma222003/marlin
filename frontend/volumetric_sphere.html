<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volumetric Sphere</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    touch-action: none;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }

  #hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.42);
    font-size: 13px;
    letter-spacing: 0.02em;
    pointer-events: none;
    transition: opacity 0.6s ease;
    text-align: center;
    line-height: 1.6;
    z-index: 5;
  }
  #hint.fade { opacity: 0; }

  #energyBar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, #2effc2, #a35bff);
    width: 0%;
    transition: width 0.08s linear;
    box-shadow: 0 0 8px rgba(46,255,194,0.6);
  }

  /* ================= chat: borderless, full-bleed ==================
     No panel/card. Messages float directly on the 3D scene; only the
     input row has any visual container. The sphere lives docked top-left
     once chatting starts, the thread rail lives on the right, and the
     transcript fills the open space between them, bottom-anchored. */
  #chatColumn {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 min(9vw, 130px) 0 min(7vw, 260px);
    pointer-events: none;
    z-index: 10;
    transition: padding-right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* when the thread rail is open, give the transcript enough right-side
     room to clear it instead of letting messages run under its edge */
  #chatColumn.railOpen {
    padding-right: calc(min(300px, 78vw) + 6vw);
  }

  /* new-chat lives as an icon button inside the input row itself (see
     #chatForm below) rather than as a separate top-bar element */
  #newChatBtn {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.85);
    transition: opacity 0.25s ease, transform 0.25s ease, color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  #newChatBtn.show { opacity: 1; pointer-events: auto; transform: scale(1); }
  #newChatBtn:hover {
    color: rgba(255,255,255,0.95);
    border-color: rgba(111,216,255,0.4);
    background: rgba(111,216,255,0.1);
  }
  #newChatBtn svg { width: 15px; height: 15px; }

  #messageList {
    max-height: 62vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 4px 18px;
    pointer-events: auto;
    /* fade the top edge so history scrolls out softly into the scene
       instead of hard-clipping at the container's edge */
    mask-image: linear-gradient(to bottom, transparent 0, black 40px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 40px);
  }
  #messageList::-webkit-scrollbar { width: 6px; }
  #messageList::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
  }

  #emptyState {
    margin-bottom: 8px;
    color: rgba(255,255,255,0.32);
    font-size: 13.5px;
    line-height: 1.7;
  }

  .msgRow { display: flex; }
  .msgRow.user { justify-content: flex-end; }
  .msgRow.assistant { justify-content: flex-start; }

  .msgBubble {
    max-width: 62%;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
    text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }
  /* the user's own message keeps a light pill so the two roles stay easy
     to tell apart at a glance without either one being boxed in. User text
     is shown as-is (not parsed as markdown), so it keeps literal line
     breaks/spacing from what was typed. */
  .msgRow.user .msgBubble {
    color: rgba(255,255,255,0.96);
    background: rgba(111,216,255,0.1);
    border: 1px solid rgba(111,216,255,0.18);
    border-radius: 14px;
    padding: 9px 14px;
    white-space: pre-wrap;
  }
  .msgRow.assistant .msgBubble {
    color: rgba(255,255,255,0.88);
    padding: 2px 2px;
    max-width: 74%;
  }
  .msgBubble .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: rgba(255,255,255,0.75);
    margin-left: 2px;
    vertical-align: -0.15em;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- markdown rendering, assistant messages only ---------- */
  .msgBubble.markdown > *:first-child { margin-top: 0; }
  .msgBubble.markdown > *:last-child { margin-bottom: 0; }
  .msgBubble.markdown p { margin: 0 0 10px; }
  .msgBubble.markdown h1,
  .msgBubble.markdown h2,
  .msgBubble.markdown h3 {
    margin: 18px 0 8px;
    font-weight: 600;
    line-height: 1.35;
    color: rgba(255,255,255,0.95);
  }
  .msgBubble.markdown h1 { font-size: 1.35em; }
  .msgBubble.markdown h2 { font-size: 1.18em; }
  .msgBubble.markdown h3 { font-size: 1.05em; }
  .msgBubble.markdown ul,
  .msgBubble.markdown ol {
    margin: 0 0 10px;
    padding-left: 1.4em;
  }
  .msgBubble.markdown li { margin: 3px 0; }
  .msgBubble.markdown li > p { margin: 0; }
  .msgBubble.markdown a {
    color: #6fd8ff;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .msgBubble.markdown a:hover { color: #9fe6ff; }
  .msgBubble.markdown strong { color: rgba(255,255,255,0.97); font-weight: 600; }
  .msgBubble.markdown em { font-style: italic; }
  .msgBubble.markdown blockquote {
    margin: 0 0 10px;
    padding: 2px 14px;
    border-left: 2px solid rgba(111,216,255,0.35);
    color: rgba(255,255,255,0.68);
  }
  .msgBubble.markdown hr {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.12);
    margin: 14px 0;
  }
  .msgBubble.markdown code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.87em;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 0.15em 0.4em;
  }
  .msgBubble.markdown pre {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow-x: auto;
  }
  .msgBubble.markdown pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.55;
    color: rgba(210,235,255,0.92);
  }
  .msgBubble.markdown table {
    border-collapse: collapse;
    margin: 0 0 10px;
    font-size: 0.92em;
  }
  .msgBubble.markdown th,
  .msgBubble.markdown td {
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px 10px;
    text-align: left;
  }
  .msgBubble.markdown th { color: rgba(255,255,255,0.92); background: rgba(255,255,255,0.04); }
  .msgBubble.markdown img { max-width: 100%; border-radius: 8px; }

  #chatStatus {
    padding: 0 4px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 0.02em;
    height: 0;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, height 0.3s ease;
  }
  #chatStatus.show { opacity: 1; height: 22px; }

  #chatDock {
    pointer-events: auto;
    padding: 10px 4px 30px;
  }
  #chatForm {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(16, 18, 24, 0.6);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border-radius: 999px;
    padding: 8px 8px 8px 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  #chatForm:focus-within {
    border-color: rgba(111, 216, 255, 0.45);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 3px rgba(111,216,255,0.08);
  }
  #chatInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: rgba(255,255,255,0.94);
    font-size: 14px;
    font-family: inherit;
    padding: 8px 0;
  }
  #chatInput::placeholder { color: rgba(255,255,255,0.34); }

  #chatSend {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2effc2, #6fd8ff);
    color: #05060a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #chatSend:hover:not(:disabled) { transform: scale(1.06); }
  #chatSend:disabled { opacity: 0.35; cursor: default; }
  #chatSend svg { width: 15px; height: 15px; }

  /* ================= thread rail: angled/trapezoidal panel, right side ================ */
  #threadRailToggle {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 11;
    background: rgba(18, 20, 28, 0.6);
    border: 1px solid rgba(255,255,255,0.12);
    border-right: none;
    color: rgba(255,255,255,0.55);
    padding: 14px 10px;
    border-radius: 12px 0 0 12px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: color 0.2s ease, background 0.2s ease;
  }
  #threadRailToggle:hover { color: rgba(255,255,255,0.9); background: rgba(18,20,28,0.85); }
  #threadRailToggle svg { width: 16px; height: 16px; display: block; }

  #threadRail {
    position: fixed;
    right: 0;
    top: 0;
    height: 100%;
    width: min(300px, 78vw);
    z-index: 12;
    /* trapezoidal silhouette: left edge slants inward from top and bottom,
       giving the panel a faceted, 3D-ish wedge shape instead of a flat
       rectangle, while staying flush with the right edge of the screen */
    clip-path: polygon(11% 0%, 100% 0%, 100% 100%, 0% 100%);
    background:
      linear-gradient(115deg, rgba(111,216,255,0.07), transparent 40%),
      rgba(11, 12, 17, 0.86);
    border-left: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: -24px 0 60px rgba(0,0,0,0.45);
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
  }
  #threadRail.open { transform: translateX(0); }

  #threadRailHeader {
    flex: 0 0 auto;
    padding: 26px 22px 16px 40px;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #threadRailHeader span { color: rgba(255,255,255,0.32); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 6px; }

  #threadList {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 20px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #threadList::-webkit-scrollbar { width: 6px; }
  #threadList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }

  .threadItem {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 8px 8px 8px 12px;
    color: rgba(255,255,255,0.68);
    font-family: inherit;
  }
  .threadItem:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.08); }
  .threadItem.active {
    background: rgba(111,216,255,0.1);
    border-color: rgba(111,216,255,0.28);
    color: rgba(255,255,255,0.95);
  }
  .threadItem .threadMain {
    flex: 1 1 auto;
    min-width: 0;
    text-align: left;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }
  .threadItem .threadTitle {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .threadItem .threadDate {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
  }
  .threadItem .threadTitleInput {
    width: 100%;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(111,216,255,0.35);
    border-radius: 6px;
    color: rgba(255,255,255,0.95);
    font-family: inherit;
    font-size: 13px;
    padding: 3px 6px;
  }

  .threadActions {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .threadItem:hover .threadActions,
  .threadItem:focus-within .threadActions { opacity: 1; }
  .threadActionBtn {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: rgba(255,255,255,0.45);
    cursor: pointer;
  }
  .threadActionBtn:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.08); }
  .threadActionBtn.danger:hover { color: #ff6f6f; background: rgba(255,111,111,0.1); }
  .threadActionBtn svg { width: 13px; height: 13px; }
  #threadEmpty {
    color: rgba(255,255,255,0.3);
    font-size: 12.5px;
    padding: 10px 12px;
  }

  #railScrim {
    position: fixed;
    inset: 0;
    z-index: 11;
    background: rgba(0,0,0,0);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #railScrim.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="energyBar"></div>
<div id="hint">drag to rotate &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; click to trigger a change &nbsp;·&nbsp; ask a question below</div>

<div id="chatColumn">
  <div id="messageList">
    <div id="emptyState">Ask something below to get started.</div>
  </div>
  <div id="chatStatus"></div>
  <div id="chatDock">
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Ask something…" maxlength="4000" />
      <button id="chatSend" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
      </button>
      <button id="newChatBtn" type="button" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 2.64 6.36"/><path d="M3 21v-5h5"/></svg>
      </button>
    </form>
  </div>
</div>

<button id="threadRailToggle" type="button" aria-label="Show threads">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<div id="railScrim"></div>
<div id="threadRail">
  <div id="threadRailHeader">Threads<span id="threadCount"></span></div>
  <div id="threadList"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<script>
(function () {
  // ---------- basic scene setup ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6.2);

  // antialias off and no alpha channel: both cost extra GPU work we don't need
  const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // ---------- geometry: enough resolution to stay smooth, no more ----------
  const geometry = new THREE.IcosahedronGeometry(1.6, 16);

  // ---------- shader material ----------
  const uniforms = {
    uTime:    { value: 0 },
    uEnergy:  { value: 0 },   // decaying pulse, only rises on click
    uTideDir: { value: new THREE.Vector3(1, 0, 0) },  // world-space "moon" direction
    uTideAmt: { value: 0 },   // fades in/out when space is pressed
    uColorA:  { value: new THREE.Color(0x3a1f7a) }, // deep violet
    uColorB:  { value: new THREE.Color(0x6fd8ff) }, // pale cyan glow
    uColorC:  { value: new THREE.Color(0xff6f61) }  // warm ripple accent
  };

  const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: `
      uniform float uTime;
      uniform float uEnergy;
      uniform vec3 uTideDir;
      uniform float uTideAmt;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisp;

      // --- classic simplex noise (Ashima/McEwan), compact 3D version ---
      vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
      vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
      vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v){
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
      }

      // displacement amount at a given point on the base sphere
      float displacement(vec3 p) {
        float base = snoise(p * 0.8 + uTime * 0.15) * 0.14;
        float wave = snoise(p * 1.6 - uTime * 0.22) * 0.06;
        float d = base + wave;
        // this extra noise sample only runs while a click pulse is active,
        // skipping it the rest of the time saves real GPU work at rest
        if (uEnergy > 0.001) {
          d += snoise(p * 2.4 - uTime * 0.7) * 0.16 * uEnergy;
        }
        // tide: one clear bulge pulled toward the "moon" direction, like
        // something is reaching in and stretching that part of the surface.
        // Skipped entirely when off.
        if (uTideAmt > 0.001) {
          float align = max(dot(normalize(p), uTideDir), 0.0);
          float lobe = pow(align, 3.0);
          d += lobe * uTideAmt * 0.55;
        }
        return d;
      }

      void main() {
        // displace the center point
        float centerDisp = displacement(position);
        vec3 displaced = position + normal * centerDisp;
        vDisp = centerDisp;

        // sample two nearby points along the local tangent plane and
        // displace them too, then rebuild the normal from the resulting
        // surface so shading follows the smooth fluid shape rather than
        // the flat facets of the underlying low-poly sphere
        float e = 0.035;
        vec3 tangent1 = normalize(cross(normal, abs(normal.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        vec3 tangent2 = normalize(cross(normal, tangent1));

        vec3 pA = position + tangent1 * e;
        vec3 pB = position + tangent2 * e;
        vec3 dA = pA + normal * displacement(pA);
        vec3 dB = pB + normal * displacement(pB);

        vec3 smoothNormal = normalize(cross(dA - displaced, dB - displaced));
        vNormal = normalize(normalMatrix * smoothNormal);

        vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
        vViewDir = normalize(cameraPosition - worldPos.xyz);

        gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColorA;
      uniform vec3 uColorB;
      uniform vec3 uColorC;
      uniform float uEnergy;
      varying vec3 vNormal;
      varying vec3 vViewDir;
      varying float vDisp;

      void main() {
        float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.2);

        // base gradient between two deep tones, lifted by displacement
        vec3 base = mix(uColorA, uColorB, clamp(vDisp * 3.0 + 0.5, 0.0, 1.0));

        // warm accent bleeds in with energy / ripple intensity
        vec3 col = mix(base, uColorC, clamp(uEnergy * 0.5 + abs(vDisp) * 1.5, 0.0, 0.6));

        // rim glow
        col += fresnel * 0.55;

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  const sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);

  // random per-load starting point in the noise field, so the shape's
  // evolution is different every time the page opens, not the same replay
  const timeSeed = Math.random() * 1000;

  // ---------- interaction: drag to rotate the sphere in place ----------
  let isDragging = false;
  let prevX = 0, prevY = 0;
  let rotX = 0.15, rotY = 0.3;
  let velX = 0, velY = 0.0015; // gentle idle spin

  function pointerDown(x, y) {
    isDragging = true;
    prevX = x; prevY = y;
    velX = 0; velY = 0;
  }
  function pointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - prevX;
    const dy = y - prevY;
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    velY = dx * 0.0006;
    velX = dy * 0.0006;
    prevX = x; prevY = y;
  }
  function pointerUp() { isDragging = false; }

  renderer.domElement.addEventListener('mousedown', e => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  renderer.domElement.addEventListener('touchstart', e => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', pointerUp);

  // zoom limits: MIN_ZOOM is kept safely outside the sphere's radius (1.6)
  // plus the largest it can ever bulge out to, so the camera can't end up
  // inside the surface no matter how far someone scrolls in
  const MIN_ZOOM = 3.2;
  const MAX_ZOOM = 10;

  // scroll to zoom
  window.addEventListener('wheel', e => {
    camera.position.z += e.deltaY * 0.003;
    camera.position.z = Math.min(Math.max(camera.position.z, MIN_ZOOM), MAX_ZOOM);
  }, { passive: true });

  // ---------- tide: a bulge orbiting the sphere, like Earth's tidal bulge
  // staying pointed at the Moon while Earth spins underneath it. Driven
  // entirely by chat state now (on while a reply is streaming), not by a
  // standalone keybinding ----------
  let tideOn = false;
  let tideAmt = 0;
  let tideAngle = 0;
  const tideWorldDir = new THREE.Vector3();
  const tideLocalDir = new THREE.Vector3();
  const invQuat = new THREE.Quaternion();

  // ---------- chat-driven state: "idle" (normal sim, centered) before any
  // message has been sent, "docked" (small top-left "logo", parked there
  // for the rest of the session once chatting has started) the moment the
  // first message goes out, "answering" (docked + tidal motion) while a
  // reply streams in ----------
  let chatState = 'idle'; // idle | docked | answering
  const posX = { cur: 0 }, posY = { cur: 0 };
  const posScale = { cur: 1 };

  function setChatState(state) {
    chatState = state;
    tideOn = (state === 'answering');
  }

  // Dock target is recomputed every frame from the camera's actual visible
  // frustum at the sphere's depth, so "top-left corner" always means the
  // real top-left corner of the viewport regardless of window size/aspect
  // ratio or zoom level — not a fixed world-unit guess. The inset is a
  // fixed screen-space fraction (of the *smaller* viewport dimension, so it
  // scales sensibly on both narrow and wide windows) plus the sphere's own
  // radius at logo scale, so the "logo" always sits fully on-screen with
  // consistent breathing room instead of clipping on narrow viewports.
  const SPHERE_RADIUS = 1.6; // matches the IcosahedronGeometry radius above
  const DOCK_SCALE = 0.16;   // "logo" size relative to full sphere scale
  const DOCK_INSET_FRAC = 0.1; // corner inset, as a fraction of min(viewWidth, viewHeight)

  function getDockTarget() {
    const dist = camera.position.z; // sphere sits at z=0, camera looks down -z
    const viewHeight = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) * dist;
    const viewWidth = viewHeight * camera.aspect;
    const inset = Math.min(viewWidth, viewHeight) * DOCK_INSET_FRAC;
    const logoRadius = SPHERE_RADIUS * DOCK_SCALE;
    return {
      x: -Math.max(viewWidth / 2 - inset - logoRadius, logoRadius),
      y: Math.max(viewHeight / 2 - inset - logoRadius, logoRadius),
    };
  }

  // ---------- click triggers a "pulse": the only thing that changes shape ----------
  let energy = 0;
  const energyBar = document.getElementById('energyBar');
  const hint = document.getElementById('hint');

  renderer.domElement.addEventListener('click', () => {
    energy = Math.min(energy + 0.9, 1.6);
    hint.classList.add('fade');
  });

  // ---------- resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animation loop ----------
  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    elapsed += delta;

    // decay energy smoothly back toward 0 after a click
    energy += (0 - energy) * 0.035;
    uniforms.uTime.value = elapsed + timeSeed;
    uniforms.uEnergy.value = energy;
    energyBar.style.width = Math.min(energy / 1.6 * 100, 100) + '%';

    // tide: fade the effect in/out, and keep the "moon" orbiting steadily
    // in world space while the sphere spins independently underneath it
    tideAmt += ((tideOn ? 1 : 0) - tideAmt) * 0.03;
    if (tideAmt > 0.001) {
      tideAngle += delta * 0.9;
      // orbit in the camera's right/up plane (not the view-axis plane), so
      // the bulge always sweeps around the visible edge of the sphere as
      // seen on screen, instead of sometimes facing straight at/away from
      // the camera where it would look like a blob or disappear entirely
      tideWorldDir.set(Math.cos(tideAngle), Math.sin(tideAngle), 0);
      invQuat.copy(sphere.quaternion).invert();
      tideLocalDir.copy(tideWorldDir).applyQuaternion(invQuat);
      uniforms.uTideDir.value.copy(tideLocalDir);
    }
    uniforms.uTideAmt.value = tideAmt;

    if (!isDragging) {
      rotX += velX;
      rotY += velY;
      velX *= 0.96;
      velY += (0.0015 - velY) * 0.01; // settle back to gentle idle spin
    }
    sphere.rotation.x = rotX;
    sphere.rotation.y = rotY;

    // scale bump ties directly to energy, so it only pulses on a click
    const docked = (chatState === 'docked' || chatState === 'answering');
    const scaleTarget = docked ? DOCK_SCALE : 1;
    const targetScale = scaleTarget + energy * 0.03 * (docked ? DOCK_SCALE : 1);
    posScale.cur += (targetScale - posScale.cur) * 0.06;
    sphere.scale.setScalar(posScale.cur);

    // smoothly drift toward the top-left "logo" position once chatting has
    // started, and stay parked there for the rest of the session (it only
    // returns to center on a brand new chat) — same easing both directions
    // so the transition reads as one continuous, reversible motion. Target
    // is recomputed from the live camera frustum every frame, so it always
    // lands in the real top-left corner regardless of window size/aspect
    // ratio, and re-settles correctly if the window is resized mid-dock.
    const dock = getDockTarget();
    const targetX = docked ? dock.x : 0;
    const targetY = docked ? dock.y : 0;
    posX.cur += (targetX - posX.cur) * 0.045;
    posY.cur += (targetY - posY.cur) * 0.045;
    sphere.position.x = posX.cur;
    sphere.position.y = posY.cur;

    renderer.render(scene, camera);
  }
  animate();

  // ---------- chat wiring ----------
  const API_BASE = window.MARLIN_API_BASE || 'http://localhost:8000';
  const THREAD_STORAGE_KEY = 'marlin.thread_id';

  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatStatus = document.getElementById('chatStatus');
  const chatColumn = document.getElementById('chatColumn');
  const messageList = document.getElementById('messageList');
  const emptyState = document.getElementById('emptyState');
  const newChatBtn = document.getElementById('newChatBtn');
  const threadRail = document.getElementById('threadRail');
  const threadRailToggle = document.getElementById('threadRailToggle');
  const threadList = document.getElementById('threadList');
  const threadCount = document.getElementById('threadCount');
  const railScrim = document.getElementById('railScrim');

  let threadId = null;
  let threadReady = null;
  let sending = false;

  // top bar (title + new-chat) only appears once there's something to act
  // on — an empty page doesn't need a "new chat" button yet

  function loadStoredThreadId() {
    try { return localStorage.getItem(THREAD_STORAGE_KEY); } catch { return null; }
  }
  function storeThreadId(id) {
    try { localStorage.setItem(THREAD_STORAGE_KEY, id); } catch {}
  }
  function clearStoredThreadId() {
    try { localStorage.removeItem(THREAD_STORAGE_KEY); } catch {}
  }

  function ensureThread() {
    if (threadReady) return threadReady;

    const existing = loadStoredThreadId();
    if (existing) {
      threadId = existing;
      threadReady = Promise.resolve(existing);
      return threadReady;
    }

    threadReady = fetch(`${API_BASE}/conversations`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: '' }),
    })
      .then(r => {
        if (!r.ok) throw new Error(`conversation create failed: ${r.status}`);
        return r.json();
      })
      .then(data => {
        threadId = data.thread_id;
        storeThreadId(threadId);
        return threadId;
      })
      .catch(err => {
        threadReady = null; // allow retry on next send
        throw err;
      });
    return threadReady;
  }

  // ---------- message list ----------
  function hideEmptyState() {
    if (emptyState.parentNode) emptyState.remove();
  }

  function scrollListToBottom() {
    messageList.scrollTop = messageList.scrollHeight;
  }

  // marked + DOMPurify render assistant replies as markdown; user messages
  // stay as literal plain text (no reason to parse what someone typed)
  function renderMarkdown(bubble, rawText) {
    const html = marked.parse(rawText, { breaks: true });
    bubble.innerHTML = DOMPurify.sanitize(html);
  }

  // While a reply is still streaming in, the buffer can end mid-marker —
  // e.g. "Some **bold" with the closing "**" not received yet. Parsing that
  // as-is renders the dangling "**" as literal text instead of holding it
  // back, so it visibly flickers as raw markdown until the next token
  // closes it. This scans the tail for an inline marker left open (odd
  // count) and, if found, trims back to just before it — so a token still
  // in flight simply isn't shown yet rather than shown broken. It appears
  // correctly formatted as soon as its closing marker arrives.
  const INLINE_MARKERS = ['***', '**', '__', '~~', '`', '*', '_'];
  function trimTrailingOpenMarker(text) {
    const fenceCount = (text.match(/```/g) || []).length;
    if (fenceCount % 2 === 1) {
      // inside an unclosed fenced code block: leave it alone, marked
      // already renders an open ``` block as a normal <pre> as-is
      return text;
    }

    // only the current paragraph can have an unclosed marker — anything
    // before the last blank line is already a settled, complete block
    const paraStart = text.lastIndexOf('\n\n');
    const para = paraStart === -1 ? text : text.slice(paraStart + 2);
    const paraOffset = paraStart === -1 ? 0 : paraStart + 2;

    // scan left to right, consuming the longest matching marker at each
    // position, tracking which markers are currently "open"; whichever
    // marker (if any) is still open when we reach the end is the dangling
    // one, and we cut back to right before it opened
    let i = 0;
    const openStack = []; // {marker, at}
    while (i < para.length) {
      const hit = INLINE_MARKERS.find(m => para.startsWith(m, i));
      if (hit) {
        const top = openStack[openStack.length - 1];
        if (top && top.marker === hit) {
          openStack.pop(); // closes the most recent matching open marker
        } else {
          openStack.push({ marker: hit, at: i });
        }
        i += hit.length;
      } else {
        i += 1;
      }
    }

    if (openStack.length === 0) return text;
    const cutAt = paraOffset + openStack[0].at;
    return text.slice(0, cutAt);
  }

  function addMessage(role, content) {
    hideEmptyState();
    newChatBtn.classList.add('show');
    const row = document.createElement('div');
    row.className = `msgRow ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'msgBubble';
    if (role === 'assistant') {
      bubble.classList.add('markdown');
      bubble.dataset.raw = content;
      renderMarkdown(bubble, content);
    } else {
      bubble.textContent = content;
    }
    row.appendChild(bubble);
    messageList.appendChild(row);
    scrollListToBottom();
    return bubble;
  }

  function clearMessages() {
    messageList.innerHTML = '';
    messageList.appendChild(emptyState);
    newChatBtn.classList.remove('show');
  }

  async function loadHistory(id) {
    try {
      const res = await fetch(`${API_BASE}/conversations/${id}/messages?limit=20`);
      if (!res.ok) return; // e.g. 404 for a stored id the backend no longer knows
      const data = await res.json();
      (data.messages || []).forEach(m => {
        if (m.role === 'user' || m.role === 'assistant') addMessage(m.role, m.content);
      });
      if ((data.messages || []).length > 0) setChatState('docked');
    } catch {
      // history is a nice-to-have; a failed fetch shouldn't block chatting
    }
  }

  function startNewChat() {
    clearStoredThreadId();
    threadId = null;
    threadReady = null;
    clearMessages();
    setStatus('');
    setChatState('idle');
    chatInput.value = '';
    chatInput.focus();
    highlightActiveThread();
  }

  newChatBtn.addEventListener('click', startNewChat);

  // resume a stored conversation on load: warms the thread and shows recent
  // history; a fresh visitor just gets a new thread with no history to show,
  // and the sphere stays centered until the first message goes out
  const storedThreadId = loadStoredThreadId();
  if (storedThreadId) loadHistory(storedThreadId);
  ensureThread().catch(() => {});

  function setStatus(msg) {
    chatStatus.textContent = msg;
    chatStatus.classList.toggle('show', !!msg);
  }

  async function sendMessage(message) {
    if (sending || !message.trim()) return;
    sending = true;
    chatSend.disabled = true;
    hint.classList.add('fade');

    // docks the sphere in the top-left corner (if it isn't already) and
    // keeps it there for the rest of the session
    setChatState('docked');
    addMessage('user', message);
    setStatus('thinking…');

    let replyBubble = null;
    let replyRaw = '';
    try {
      const id = await ensureThread();

      const res = await fetch(`${API_BASE}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, thread_id: id }),
      });
      if (!res.ok || !res.body) throw new Error(`chat request failed: ${res.status}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        // SSE frames are separated by a blank line
        let frameEnd;
        while ((frameEnd = buf.indexOf('\n\n')) !== -1) {
          const frame = buf.slice(0, frameEnd);
          buf = buf.slice(frameEnd + 2);

          let event = 'message';
          let data = '';
          for (const line of frame.split('\n')) {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            else if (line.startsWith('data:')) data += line.slice(5).trim();
          }
          if (!data) continue;

          let payload;
          try { payload = JSON.parse(data); } catch { continue; }

          if (event === 'progress') {
            setStatus(typeof payload.content === 'string' ? payload.content : 'working…');
          } else if (event === 'token') {
            if (!replyBubble) {
              // first token: sphere switches to its tidal motion while the
              // reply streams in, still parked in its corner
              setChatState('answering');
              setStatus('');
              replyBubble = addMessage('assistant', '');
            }
            replyRaw += payload.content || '';
            // re-parse the accumulated markdown on every token rather than
            // patching the DOM incrementally — cheap at this text volume,
            // and avoids ending up with a half-open **bold** or list mid-stream.
            // Trim back any marker left dangling open by this token, so it
            // shows once complete instead of flickering as literal "**"/"`"
            // while its closing half is still in flight.
            renderMarkdown(replyBubble, trimTrailingOpenMarker(replyRaw));
            replyBubble.dataset.raw = replyRaw;
            replyBubble.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
            scrollListToBottom();
          } else if (event === 'done') {
            // final render uses the complete, untrimmed text — anything
            // held back mid-stream (a marker that only just closed) shows now
            if (replyBubble) {
              renderMarkdown(replyBubble, replyRaw);
              replyBubble.dataset.raw = replyRaw;
            }
            setStatus('');
            setChatState('docked');
          } else if (event === 'error') {
            if (!replyBubble) replyBubble = addMessage('assistant', '');
            replyRaw += `\n\n_[error: ${payload.detail || 'something went wrong'}]_`;
            renderMarkdown(replyBubble, replyRaw);
            replyBubble.dataset.raw = replyRaw;
            setStatus('');
            setChatState('docked');
          }
        }
      }
    } catch (err) {
      setStatus('');
      addMessage('assistant', `Couldn't reach the assistant (${err.message}). Is the backend running?`);
      setChatState('docked');
    } finally {
      sending = false;
      chatSend.disabled = false;
    }
  }

  chatForm.addEventListener('submit', e => {
    e.preventDefault();
    const message = chatInput.value;
    if (!message.trim() || sending) return;
    chatInput.value = '';
    sendMessage(message);
  });

  // ---------- thread rail: angled panel listing recent conversations ----------
  function highlightActiveThread() {
    threadList.querySelectorAll('.threadItem').forEach(el => {
      el.classList.toggle('active', el.dataset.threadId === threadId);
    });
  }

  function formatThreadDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
        ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch { return ''; }
  }

  async function loadThreadList() {
    try {
      const res = await fetch(`${API_BASE}/conversations?limit=30`);
      if (!res.ok) throw new Error(`status ${res.status}`);
      const data = await res.json();
      const conversations = data.conversations || [];
      threadCount.textContent = conversations.length ? `(${conversations.length})` : '';
      threadList.innerHTML = '';

      if (conversations.length === 0) {
        const empty = document.createElement('div');
        empty.id = 'threadEmpty';
        empty.textContent = 'No conversations yet.';
        threadList.appendChild(empty);
        return;
      }

      conversations.forEach(conv => threadList.appendChild(renderThreadItem(conv)));
      highlightActiveThread();
    } catch {
      threadList.innerHTML = '';
      const empty = document.createElement('div');
      empty.id = 'threadEmpty';
      empty.textContent = "Couldn't load threads.";
      threadList.appendChild(empty);
    }
  }

  function threadDisplayTitle(conv) {
    return conv.title && conv.title.trim() ? conv.title : `Thread ${conv.thread_id.slice(0, 8)}`;
  }

  function renderThreadItem(conv) {
    const item = document.createElement('div');
    item.className = 'threadItem';
    item.dataset.threadId = conv.thread_id;

    const main = document.createElement('button');
    main.type = 'button';
    main.className = 'threadMain';
    const title = document.createElement('div');
    title.className = 'threadTitle';
    title.textContent = threadDisplayTitle(conv);
    const date = document.createElement('div');
    date.className = 'threadDate';
    date.textContent = formatThreadDate(conv.created_at);
    main.appendChild(title);
    main.appendChild(date);
    main.addEventListener('click', () => switchThread(conv.thread_id));

    const actions = document.createElement('div');
    actions.className = 'threadActions';

    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'threadActionBtn';
    editBtn.setAttribute('aria-label', 'Rename thread');
    editBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
    editBtn.addEventListener('click', e => {
      e.stopPropagation();
      startEditingThreadTitle(item, conv);
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.type = 'button';
    deleteBtn.className = 'threadActionBtn danger';
    deleteBtn.setAttribute('aria-label', 'Delete thread');
    deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>';
    deleteBtn.addEventListener('click', e => {
      e.stopPropagation();
      deleteThread(conv.thread_id);
    });

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);
    item.appendChild(main);
    item.appendChild(actions);
    return item;
  }

  function startEditingThreadTitle(item, conv) {
    const main = item.querySelector('.threadMain');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'threadTitleInput';
    input.maxLength = 200;
    input.value = conv.title && conv.title.trim() ? conv.title : '';
    input.placeholder = threadDisplayTitle(conv);

    main.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = async () => {
      if (settled) return;
      settled = true;
      const newTitle = input.value.trim();
      input.replaceWith(main);
      if (newTitle === (conv.title || '')) return; // unchanged, nothing to save
      try {
        const res = await fetch(`${API_BASE}/conversations/${conv.thread_id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle }),
        });
        if (!res.ok) throw new Error(`status ${res.status}`);
        conv.title = newTitle;
        main.querySelector('.threadTitle').textContent = threadDisplayTitle(conv);
      } catch {
        // rename failed silently reverts to the last known title — the
        // thread rail is a convenience view, not worth an error dialog for
      }
    };
    const cancel = () => {
      if (settled) return;
      settled = true;
      input.replaceWith(main);
    };

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
    input.addEventListener('blur', commit);
  }

  async function deleteThread(id) {
    const item = threadList.querySelector(`.threadItem[data-thread-id="${id}"]`);
    const label = item ? item.querySelector('.threadTitle').textContent : 'this thread';
    if (!window.confirm(`Delete "${label}"? This can't be undone.`)) return;

    try {
      const res = await fetch(`${API_BASE}/conversations/${id}`, { method: 'DELETE' });
      if (!res.ok && res.status !== 404) throw new Error(`status ${res.status}`);
      if (item) item.remove();

      const remaining = threadList.querySelectorAll('.threadItem').length;
      threadCount.textContent = remaining ? `(${remaining})` : '';
      if (remaining === 0) {
        const empty = document.createElement('div');
        empty.id = 'threadEmpty';
        empty.textContent = 'No conversations yet.';
        threadList.appendChild(empty);
      }

      // deleting the thread currently open in the transcript: start fresh
      if (id === threadId) startNewChat();
    } catch {
      window.alert("Couldn't delete that thread. Please try again.");
    }
  }

  function switchThread(id) {
    if (id === threadId) { closeRail(); return; }
    threadId = id;
    threadReady = Promise.resolve(id);
    storeThreadId(id);
    clearMessages();
    setStatus('');
    setChatState('idle');
    loadHistory(id);
    closeRail();
  }

  function openRail() {
    threadRail.classList.add('open');
    railScrim.classList.add('show');
    chatColumn.classList.add('railOpen');
    loadThreadList();
  }
  function closeRail() {
    threadRail.classList.remove('open');
    railScrim.classList.remove('show');
    chatColumn.classList.remove('railOpen');
  }

  threadRailToggle.addEventListener('click', () => {
    if (threadRail.classList.contains('open')) closeRail();
    else openRail();
  });
  railScrim.addEventListener('click', closeRail);
})();
</script>
</body>
</html>
